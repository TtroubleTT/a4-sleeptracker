<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/tabs/log-sleep"></ion-back-button>
    </ion-buttons>
    <ion-title>
      Sleep Tracker
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <h1>Log Overnight Sleep</h1>
  <h2>Record your bedtime and wake up time.</h2>

  <h3>Bedtime</h3>
  <ion-card class="card-container">
    <ion-card-header>
      <div class="card-layout">
        <ion-icon name="moon"></ion-icon>
        <div class="card-text">
          <ion-card-title>Select when you went to bed</ion-card-title>
          <ion-card-subtitle>Choose date and time</ion-card-subtitle>
        </div>
      </div>
    </ion-card-header>

    <ion-card-content>
      <ion-datetime-button datetime="bedtime-picker"></ion-datetime-button>

      <ion-modal [keepContentsMounted]="true">
        <ng-template>
          <ion-datetime id="bedtime-picker" presentation="date-time" [(ngModel)]="sleepStart"></ion-datetime>
        </ng-template>
      </ion-modal>
    </ion-card-content>
  </ion-card>

  <h3>Wake-up Time</h3>
  <ion-card class="card-container">
    <ion-card-header>
      <div class="card-layout">
        <ion-icon name="sunny"></ion-icon>
        <div class="card-text">
          <ion-card-title>Select when you woke up</ion-card-title>
          <ion-card-subtitle>Choose date and time</ion-card-subtitle>
        </div>
      </div>
    </ion-card-header>

    <ion-card-content>
      <ion-datetime-button datetime="wake-picker"></ion-datetime-button>

      <ion-modal [keepContentsMounted]="true">
        <ng-template>
          <ion-datetime id="wake-picker" presentation="date-time" [(ngModel)]="sleepEnd"></ion-datetime>
        </ng-template>
      </ion-modal>
    </ion-card-content>
  </ion-card>

  <h3>How well did you sleep?</h3>
  <div class="segment-container">
    <ion-segment [(ngModel)]="sleepQuality">
      <ion-segment-button value="1">
        <ion-label>1</ion-label>
      </ion-segment-button>
      <ion-segment-button value="2">
        <ion-label>2</ion-label>
      </ion-segment-button>
      <ion-segment-button value="3">
        <ion-label>3</ion-label>
      </ion-segment-button>
      <ion-segment-button value="4">
        <ion-label>4</ion-label>
      </ion-segment-button>
      <ion-segment-button value="5">
        <ion-label>5</ion-label>
      </ion-segment-button>
    </ion-segment>
  </div>

  <div class="center-aligned">
    <ion-button class="save-button" (click)="saveSleepLog()">
      Save Sleep Log
    </ion-button>
  </div>
</ion-content>
