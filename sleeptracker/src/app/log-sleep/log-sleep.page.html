<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>
      Sleep Tracker
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <h1>Track Your Sleep</h1>
  <h2 class="grey">Choose what you'd like to record.</h2>
  <h3>LOG AN ENTRY</h3>
  <ion-card class="top-card" [button]="true" routerLink="/tabs/overnight-sleep">
    <ion-card-header>
      <div class="card-layout">
        <ion-icon name="bed" class="white"></ion-icon>
        <div class="card-text">
          <ion-card-title>Overnight Sleep</ion-card-title>
          <ion-card-subtitle>Record your bedtime and wake up time.</ion-card-subtitle>
        </div>
      </div>
    </ion-card-header>
  </ion-card>
  <ion-card [button]="true" routerLink="/tabs/sleepiness">
    <ion-card-header>
      <div class="card-layout">
        <img class="white" src="assets/icon/sleeping.png" alt="Sleeping person">
        <div class="card-text">
          <ion-card-title>Sleepiness</ion-card-title>
          <ion-card-subtitle>Record your current sleepiness.</ion-card-subtitle>
        </div>
      </div>
    </ion-card-header>
  </ion-card>
</ion-content>
