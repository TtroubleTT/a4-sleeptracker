<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/tabs/log-sleep"></ion-back-button>
    </ion-buttons>
    <ion-title>
      Sleep Tracker
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <h1>Log Sleepiness</h1>
  <h2>How sleepy are you feeling right now?</h2>
  <h3>Sleepiness Information</h3>

  <div class="selector-container">
    <ion-select [(ngModel)]="sleepinessRating" placeholder="Choose your sleepiness level" interface="alert" label="Sleepiness Rating" label-placement="stacked">
      @for (description of StanfordSleepinessData.ScaleValues.slice(1); track $index)
      {
        <ion-select-option [value]="$index + 1">
          {{$index + 1}} - {{description}}
        </ion-select-option>
      }
    </ion-select>
  </div>

  <div class="selector-container">
    <ion-select [(ngModel)]="activity" placeholder="Choose your activity" interface="alert" label="What were you doing?" label-placement="stacked">
      <ion-select-option value="Working">Working</ion-select-option>
      <ion-select-option value="Studying">Studying</ion-select-option>
      <ion-select-option value="Studying">In Class</ion-select-option>
      <ion-select-option value="Exercising">Exercising</ion-select-option>
      <ion-select-option value="Eating">Eating</ion-select-option>
      <ion-select-option value="Relaxing">Relaxing</ion-select-option>
      <ion-select-option value="Other">Other</ion-select-option>
    </ion-select>
  </div>

  <div class="selector-container">
    <ion-textarea [(ngModel)]="additionalInformation" label="Additional Information" label-placement="stacked" placeholder="Add any additional information..." [autoGrow]="true" [rows]="2"></ion-textarea>
  </div>

  <div class="center-aligned">
    <ion-button class="save-button" (click)="saveSleepiness()">
      Save Sleepiness Log
    </ion-button>
  </div>
</ion-content>
